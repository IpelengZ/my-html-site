<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Data Demo</title>
</head>
<body>
    <h1>Remote Data Demo</h1>

    <button id="loadBtn">Load post</button>
    <button id="xhrBtn">Load with XMLHttpRequest</button>
    <button id="jqBtn">Load with jQuery Ajax</button>

    <pre id="output">Click a button to fetch data...</pre>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        // Fetch API
        document.getElementById('loadBtn').addEventListener('click', async () => {
            const response = await fetch('https://jsonplaceholder.typicode.com/posts/1');
            const data = await response.json();
            document.getElementById('output').textContent = JSON.stringify(data, null, 2);
        });

        // XMLHttpRequest
        document.getElementById('xhrBtn').addEventListener('click', () => {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://jsonplaceholder.typicode.com/posts/1');
            xhr.onload = () => {
                document.getElementById('output').textContent = xhr.responseText;
            };
            xhr.send();
        });

        // jQuery Ajax
        $('#jqBtn').on('click', () => {
            $.ajax({
                url: 'https://jsonplaceholder.typicode.com/posts/1',
                method: 'GET',
                success: (data) => {
                    $('#output').text(JSON.stringify(data, null, 2));
                }
            });
        });
    </script>
</body>
</html>
